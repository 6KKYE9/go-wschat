<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>wschat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    #log { border: 1px solid #ccc; height: 320px; overflow-y: auto; padding: 8px; }
    .row { margin: 4px 0; }
    .user { font-weight: bold; }
    .sys { color: #888; font-style: italic; }
    input { width: 70%; padding: 6px; }
    button { padding: 6px 12px; }
  </style>
</head>
<body>
  <h2>go-wschat 聊天室</h2>
  <div id="log"></div>
  <div>
    <input id="name" placeholder="昵称" value="游客">
    <input id="msg" placeholder="说点什么，回车发送" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
  <script>
    const log = document.getElementById('log');
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      const row = document.createElement('div');
      row.className = 'row';
      if (m.user === '系统') {
        row.className += ' sys';
        row.textContent = m.text;
      } else {
        const u = document.createElement('span');
        u.className = 'user';
        u.textContent = m.user + '：';
        row.appendChild(u);
        row.appendChild(document.createTextNode(m.text));
      }
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    };
    function send() {
      const name = document.getElementById('name').value || '游客';
      const text = document.getElementById('msg').value;
      if (!text) return;
      ws.send(JSON.stringify({ user: name, text }));
      document.getElementById('msg').value = '';
    }
  </script>
</body>
</html>
